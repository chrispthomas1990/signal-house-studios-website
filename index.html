<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;

        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <link
      rel="preload"
      href="/signal-house-studios-website/fonts/korolev-condensed-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Signal House Studios is a Hertfordshire-based production studio for audio, video and live streaming, run by producer Tim Kramer."
    />
    <meta property="og:title" content="Signal House Studios" />
    <meta
      property="og:description"
      content="Signal House Studios is a Hertfordshire-based production studio for audio, video and live streaming, run by producer Tim Kramer."
    />
    <meta property="og:image" content="/signal-house-studios-website/shs-social-image.png" />
    <link rel="icon" type="image/svg+xml" href="/signal-house-studios-website/shs-favicon.svg" />
    <link rel="icon" type="image/png" href="/signal-house-studios-website/shs-favicon.png" />
    <link rel="apple-touch-icon" href="/signal-house-studios-website/apple-touch-icon.png" />
    <title>Signal House Studios</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
